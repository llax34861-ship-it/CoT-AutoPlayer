name: Build CoT AutoPlayer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          files = {
              'settings.gradle': '',
              'build.gradle': 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMTMuMicgYXBwbHkgZmFsc2UKfQo=',
              'gradle.properties': 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD1mYWxzZQphbmRyb2lkLm5vblRyYW5zaXRpdmVSQ2xhc3M9dHJ1ZQo=',
              'app/build.gradle': '',
              'app/proguard-rules.pro': 'IyBJbnRlbnRpb25hbGx5IGVtcHR5LiBObyBjb2RlIHNocmlua2luZyBpbiB2MS4K',
              'app/src/main/AndroidManifest.xml': '',
              'app/src/main/java/mx/cot/autoplayer/MainActivity.java': '',
              'app/src/main/java/mx/cot/autoplayer/AutoplayerService.java': '',
              'app/src/main/java/mx/cot/autoplayer/DecisionEngine.java': '',
              'app/src/main/java/mx/cot/autoplayer/HistoryStore.java': '',
              'app/src/main/java/mx/cot/autoplayer/BotPrefs.java': '',
              'app/src/main/res/values/strings.xml': 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPkNvVCBBdXRvUGxheWVyPC9zdHJpbmc+CiAgICA8c3RyaW5nIG5hbWU9ImFjY2Vzc2liaWxpdHlfZGVzYyI+QXV0b21hdGl6YSBkZWNpc2lvbmVzIMO6bmljYW1lbnRlIGRlbnRybyBkZWwgcGFxdWV0ZSBkZSBqdWVnbyBjb25maWd1cmFkby48L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg==',
              'app/src/main/res/values/styles.xml': '',
              'app/src/main/res/xml/accessibility_service_config.xml': '',
          }
          for rel, payload in files.items():
              p = Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(payload))
          print(f'Reconstructed {len(files)} project files')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee APK_SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoT-AutoPlayer-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
